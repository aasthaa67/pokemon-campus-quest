<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="ballShine" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer Ring Shadow & Base -->
  <circle cx="50" cy="50" r="46" fill="#1e293b" stroke="#0f172a" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Top Red Half -->
  <path d="M 6,50 A 44,44 0 0,1 94,50 Z" fill="#ef4444"/>
  
  <!-- Bottom White Half -->
  <path d="M 6,50 A 44,44 0 0,0 94,50 Z" fill="#f8fafc"/>
  
  <!-- Subtle Highlight on Red -->
  <path d="M 12,42 A 44,44 0 0,1 88,42 Z" fill="url(#ballShine)" opacity="0.4"/>
  
  <!-- Center Dark Band -->
  <rect x="4" y="46" width="92" height="8" fill="#1e293b"/>
  
  <!-- Center Outer Button -->
  <circle cx="50" cy="50" r="16" fill="#1e293b"/>
  
  <!-- Center Inner Button -->
  <circle cx="50" cy="50" r="11" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  
  <!-- Center Core -->
  <circle cx="50" cy="50" r="6" fill="#e2e8f0"/>
</svg>
